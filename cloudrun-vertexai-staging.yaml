apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: rag-capstone-staging
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        # Capped at 2 deliberately. slowapi's limiter is IN-PROCESS, so
        # maxScale is the real multiplier on RATE_LIMIT: at 10 instances a
        # configured 20/minute is up to 200/minute in practice. 2 keeps the
        # limiter approximately honest (worst case 2x) and caps worst-case
        # compute on a publicly reachable demo.
        autoscaling.knative.dev/maxScale: '2'
        autoscaling.knative.dev/targetBurstCapacity: "100"
        # Same Cloud SQL instance as production -- staging uses a separate
        # DATABASE within it (ragdb_staging), not a second instance.
        run.googleapis.com/cloudsql-instances: YOUR_PROJECT_ID:us-central1:rag-capstone-db
    spec:
      containerConcurrency: 80
      # Vertex AI (gemini-2.5-flash) is materially slower per call than
      # Groq, and /ask makes three LLM calls in sequence (rerank, generate,
      # groundedness check). Measured ~8s warm, ~30s on a cold start, so
      # the default 300s request timeout has ample headroom.
      timeoutSeconds: 300
      serviceAccountName: rag-capstone-sa@YOUR_PROJECT_ID.iam.gserviceaccount.com
      containers:
      - image: us-central1-docker.pkg.dev/YOUR_PROJECT_ID/rag-repo/rag-capstone:latest
        ports:
        - name: http1
          containerPort: 8080
        resources:
          limits:
            cpu: 2000m
            memory: 2Gi
        env:
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: rag_api_key
              key: "latest"
        # Points at ragdb_staging, not the production database -- keeps
        # staging traffic and smoke-test uploads out of production data.
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database_url_staging
              key: "latest"
        # Regex-only screening; no tokens, no extra latency.
        - name: ENABLE_INJECTION_SCREENING
          value: "true"
        # TRUE, matching production. This was "false" with a note saying
        # enabling it before `gcloud services enable dlp.googleapis.com`
        # would replace every logged question/answer with "[redaction
        # unavailable]" -- correct at the time, but DLP has since been
        # enabled on this project and production has run with redaction on
        # for weeks. Leaving staging on the opposite setting meant the one
        # environment meant to reproduce production could not catch a DLP
        # regression in the control that exists to protect visitors' text.
        - name: ENABLE_PII_REDACTION
          value: "true"
        - name: MODEL_PROVIDER
          value: "vertexai"
        - name: GCP_PROJECT_ID
          value: "YOUR_PROJECT_ID"
        - name: GCP_LOCATION
          value: "us-central1"
        # Pinned explicitly rather than relying on the config default, so
        # the model actually serving traffic is visible in review. flash-lite
        # is ~3x cheaper on input / ~6x on output than gemini-2.5-flash and
        # ~2x faster; /ask makes three LLM calls per request, so the
        # multiplier is real.
        - name: VERTEX_CHAT_MODEL
          value: "gemini-2.5-flash-lite"
        # text-embedding-005 is 768-dim vs FastEmbed's 384. app/config.py
        # now derives this from MODEL_PROVIDER, so it is set here only to
        # make the deployed value explicit and reviewable.
        - name: EMBEDDING_DIMENSION
          value: "768"
        # Same caps as production, deliberately -- staging exists to
        # reproduce production's behaviour, and an upload path that accepts
        # 25x larger files than production tests nothing useful. These were
        # imperative-only and the live staging service had lost them: it was
        # running on config.py's 50MB x 5 files, not on 2MB x 3, because the
        # imperative update was never re-run after its last replace. That is
        # the drift this file exists to prevent, caught in the act.
        - name: MAX_UPLOAD_FILES
          value: "3"
        - name: MAX_UPLOAD_SIZE_MB
          value: "3"
        - name: RATE_LIMIT
          value: "10/minute"
        # Left unset, MAX_CORPUS_CHUNKS defaults to 0 (disabled) and staging
        # silently stops being able to reproduce production's 507-when-full
        # behaviour -- which is most of the reason staging exists.
        - name: MAX_CORPUS_CHUNKS
          value: "3000"
        - name: MAX_SESSION_CHUNKS
          value: "300"
        # Per-visitor cap on DISTINCT files across ALL requests (guests);
        # raised for signed-in callers by MAX_SESSION_FILES_AUTHED.
        # MAX_UPLOAD_FILES caps one request; without this a visitor just
        # makes more requests.
        - name: MAX_SESSION_FILES
          value: "6"
        - name: MAX_SESSION_FILES_AUTHED
          value: "30"
        # Bounds on the semantic cache. It shipped with none, so every
        # uncached question on a public endpoint added a permanent row and
        # its HNSW index grew without limit. Both are needed: the TTL does
        # not cap a burst inside one window, the row cap does not cap age.
        - name: CACHE_TTL_HOURS
          value: "24"
        - name: MAX_CACHE_ROWS
          value: "5000"
        # Same reasoning as production's cloudrun-vertexai.yaml: 0 (disabled)
        # is how this shipped before. Staging shares the project's single
        # Cloud Billing budget with production, so this is deliberately not
        # raised for staging traffic.
        - name: DAILY_BUDGET_USD
          value: "0.25"
        - name: OTEL_GCP_EXPORT
          value: "true"
        # Durable staging for uploaded files (app/ingestion/storage.py). Cloud
        # Run instances have independent disks, so a Cloud Task can land on the
        # instance that never received the upload; staging in GCS removes that
        # dependency. Declared here rather than set only with `gcloud run
        # services update` -- imperative-only is how MAX_CORPUS_CHUNKS, the
        # upload limits and ENABLE_PII_REDACTION each drifted from this file.
        # Unset = fall back to instance-local disk (local dev and tests).
        #
        # Shared with production deliberately: object keys are prefixed by
        # session, and staged files are deleted once ingested, so the two
        # environments cannot collide on a key. Same simplification as the
        # shared Firestore below.
        - name: UPLOAD_BUCKET
          value: 'rag-capstone-uploads-hybrid-rag-505311'
        # Separate queue from production's ingest-queue so a staging
        # deploy's async ingestion jobs can never target the wrong service.
        # Firestore IS shared with production -- Firestore Native is one
        # database per project by default; documented, not hidden.
        - name: CLOUD_TASKS_QUEUE
          value: "ingest-queue-staging"
        # Cloud Run doesn't know its own URL until after first deploy; set
        # post-deploy via `gcloud run services update --update-env-vars`.
        # A later `services replace` resets it to this placeholder, so
        # re-run that update afterward.
        - name: INGEST_TARGET_URL
          value: "https://REPLACE-WITH-STAGING-SERVICE-URL.run.app"

        livenessProbe:
          httpGet:
            path: /health
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /ready
          periodSeconds: 15
