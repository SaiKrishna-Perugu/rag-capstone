apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: rag-capstone
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        # Capped at 2 deliberately. slowapi's limiter is IN-PROCESS, so
        # maxScale is the real multiplier on RATE_LIMIT: at 10 instances a
        # configured 20/minute is up to 200/minute in practice. 2 keeps the
        # limiter approximately honest (worst case 2x) and caps worst-case
        # compute on a publicly reachable demo.
        autoscaling.knative.dev/maxScale: '2'
        run.googleapis.com/startup-cpu-boost: 'true'
        # Cloud SQL Auth Proxy sidecar (auto-manages secure connections)
        run.googleapis.com/cloudsql-instances: YOUR_PROJECT_ID:us-central1:rag-capstone-db
    spec:
      containerConcurrency: 10
      timeoutSeconds: 300
      # Must be rag-capstone-sa, NOT the default compute service account:
      # rag-capstone-sa is the identity holding secretmanager.secretAccessor
      # on the secrets mounted below, cloudsql.client for the Auth Proxy
      # sidecar, datastore.user for Firestore, and aiplatform.user for the
      # Vertex AI calls this config exists to make. Deploying as the compute
      # default SA fails at startup on secret access.
      serviceAccountName: rag-capstone-sa@YOUR_PROJECT_ID.iam.gserviceaccount.com
      containers:
      - image: us-central1-docker.pkg.dev/YOUR_PROJECT_ID/rag-repo/rag-capstone:latest
        ports:
        - name: http1
          containerPort: 8080
        resources:
          limits:
            cpu: '2'
            memory: 2Gi
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 2
          timeoutSeconds: 2
          failureThreshold: 3
          periodSeconds: 10
        env:
        # Regex-only screening; no tokens, no extra latency.
        - name: ENABLE_INJECTION_SCREENING
          value: "true"
        # TRUE here, and this must stay in sync with the live service --
        # production has run with redaction on since DLP was enabled on this
        # project, and a `gcloud run services replace` against a "false" here
        # would silently switch a privacy control OFF while reporting success.
        # This fails CLOSED: enabling it WITHOUT
        # `gcloud services enable dlp.googleapis.com` replaces every logged
        # question/answer with "[redaction unavailable]", so a fresh project
        # must enable the DLP API before deploying this file.
        - name: ENABLE_PII_REDACTION
          value: "true"
        - name: MODEL_PROVIDER
          value: 'vertexai'
        # Required by app/config.py for MODEL_PROVIDER=vertexai, and also
        # by Firestore (conversation memory, app/memory.py) and the Cloud
        # Monitoring metrics export below.
        - name: GCP_PROJECT_ID
          value: 'YOUR_PROJECT_ID'
        - name: GCP_LOCATION
          value: 'us-central1'
        # Pinned explicitly rather than relying on the config default, so
        # the model actually serving traffic is visible in review. flash-lite
        # is ~3x cheaper on input / ~6x on output than gemini-2.5-flash and
        # ~2x faster; /ask makes three LLM calls per request, so the
        # multiplier is real.
        - name: VERTEX_CHAT_MODEL
          value: 'gemini-2.5-flash-lite'
        - name: LANGSMITH_TRACING
          value: 'false'
        - name: OTEL_GCP_EXPORT
          value: 'true'
        # Durable staging for uploaded files (app/ingestion/storage.py). Cloud
        # Run instances have independent disks, so a Cloud Task can land on the
        # instance that never received the upload; staging in GCS removes that
        # dependency. Declared here rather than set only with `gcloud run
        # services update` -- imperative-only is how MAX_CORPUS_CHUNKS, the
        # upload limits and ENABLE_PII_REDACTION each drifted from this file.
        # Unset = fall back to instance-local disk (local dev and tests).
        - name: UPLOAD_BUCKET
          value: 'rag-capstone-uploads-hybrid-rag-505311'
        - name: CLOUD_TASKS_QUEUE
          value: 'ingest-queue'
        # This service's own public URL -- Cloud Tasks needs it as the
        # HTTP target for /internal/process-ingest-job. Filled in via
        # `gcloud run services update --update-env-vars` post-deploy (not
        # knowable at deploy time); see README "Deploying to GCP". Any
        # later `services replace` using this file resets it to this
        # placeholder, so re-run that update step afterward.
        - name: INGEST_TARGET_URL
          value: 'https://REPLACE-WITH-SERVICE-URL.run.app'
        # text-embedding-005 is 768-dim, vs. FastEmbed/Groq's 384 -- this
        # sets the VECTOR(N) column width on first schema creation (see
        # app/database.py init_db()); must be set before the first ingest
        # against a fresh database.
        - name: EMBEDDING_DIMENSION
          value: '768'
        # The two per-request upload bounds, checked before anything is
        # written. Both were imperative-only until now, and the code
        # defaults they fall back to are not demo-safe: 50MB x 5 files is a
        # 250MB request on an endpoint anonymous visitors can reach. So a
        # `gcloud run services replace` with these absent did not merely
        # lose a setting, it raised the per-file ceiling 25x while
        # reporting success. Staging demonstrated exactly that -- it was
        # running on the code defaults, not on 2MB/3 files, because nobody
        # re-ran the imperative update after its last replace.
        - name: MAX_UPLOAD_FILES
          value: '3'
        - name: MAX_UPLOAD_SIZE_MB
          value: '2'
        # Matches the config.py default rather than changing it; declared
        # so it survives a replace, since the fallback for an abuse control
        # should never be silence. Per-IP and in-process, so maxScale above
        # is the real multiplier -- at maxScale 2 this is up to 20/minute.
        - name: RATE_LIMIT
          value: '10/minute'
        # Ceiling on TOTAL indexed chunks; /upload returns 507 once reached.
        # Declared here rather than only set imperatively -- it was the
        # latter, which is precisely how staging ended up uncapped (unset =
        # 0 = disabled) while production ran 3000.
        - name: MAX_CORPUS_CHUNKS
          value: '3000'
        # Per-visitor ceiling, so a single session cannot consume the whole
        # MAX_CORPUS_CHUNKS budget and lock everyone else out.
        - name: MAX_SESSION_CHUNKS
          value: '300'
        # Ceiling on estimated daily LLM+embedding spend (app/llm/budget.py,
        # app/llm/cost.py); 0 disables it, which is how this shipped before.
        # 0.25 leaves headroom under the project's separate Cloud Billing
        # budget ("rag-capstone monthly guard", ~$0.70/day total across
        # Cloud Run/Cloud SQL/Firestore/everything) for the parts of that
        # total this ceiling doesn't cover. Declared here, not only via
        # `gcloud run services update` -- imperative-only is the exact
        # pattern that dropped MAX_CORPUS_CHUNKS/upload caps/
        # ENABLE_PII_REDACTION from this file before. State is per-process
        # (see budget.py), so the real ceiling is roughly this times
        # maxScale.
        - name: DAILY_BUDGET_USD
          value: '0.25'
        # PUBLIC DEMO NOTE: the live production service intentionally runs
        # WITHOUT this secret and WITH ENABLE_UPLOADS=true -- anyone with the
        # URL can ask questions AND upload, bounded by the caps above rather
        # than by authentication. Access is tiered in app/api/middleware.py
        # (AccessControlMiddleware), not one on/off switch: /metrics needs
        # ADMIN_KEY, /internal/* needs a Cloud Tasks OIDC token, and the
        # public tier is open only while API_KEY is empty.
        #
        # Applying this file with `gcloud run services replace` re-mounts
        # the secret and re-enables auth, locking visitors out of the demo.
        # To restore the public configuration afterward:
        #   gcloud run services update rag-capstone --region=us-central1 \
        #     --remove-secrets=API_KEY --update-env-vars=ENABLE_UPLOADS=true
        # (Same reset caveat as INGEST_TARGET_URL above.)
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: rag_api_key
              key: 'latest'
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: groq_api_key
              key: 'latest'
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database_url
              key: 'latest'
