apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: rag-capstone
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '5'
        run.googleapis.com/startup-cpu-boost: 'true'
    spec:
      containerConcurrency: 10
      timeoutSeconds: 300
      serviceAccountName: compute@developer.gserviceaccount.com
      containers:
      - image: us-central1-docker.pkg.dev/YOUR_PROJECT_ID/rag-repo/rag-capstone:latest
        ports:
        - name: http1
          containerPort: 8080
        resources:
          limits:
            cpu: '2'
            memory: 2Gi
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 2
          timeoutSeconds: 2
          failureThreshold: 3
          periodSeconds: 10
        env:
        - name: MODEL_PROVIDER
          value: 'vertexai'
        - name: GCP_LOCATION
          value: 'us-central1'
        - name: LANGSMITH_TRACING
          value: 'false'
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: rag_api_key
              key: 'latest'
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: groq_api_key
              key: 'latest'
