apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: rag-capstone-staging
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    metadata:
      annotations:
        # Autoscaling bounds (scale to 0 saves money when idle)
        autoscaling.knative.dev/minScale: "0"
        # Capped at 2 deliberately. slowapi's limiter is IN-PROCESS, so
        # maxScale is the real multiplier on RATE_LIMIT: at 10 instances a
        # configured 20/minute is up to 200/minute in practice. 2 keeps the
        # limiter approximately honest (worst case 2x) and caps worst-case
        # compute on a publicly reachable demo.
        autoscaling.knative.dev/maxScale: '2'
        # Increase concurrency per instance for async FastAPI
        autoscaling.knative.dev/targetBurstCapacity: "100"
        # Same Cloud SQL instance as production -- staging uses a
        # separate DATABASE within it (ragdb_staging), not a second
        # instance. See README "Deploying to GCP" for the one-time setup.
        run.googleapis.com/cloudsql-instances: YOUR_PROJECT_ID:us-central1:rag-capstone-db
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: rag-capstone-sa@YOUR_PROJECT_ID.iam.gserviceaccount.com
      containers:
      - image: us-central1-docker.pkg.dev/YOUR_PROJECT_ID/rag-repo/rag-capstone:latest
        ports:
        - name: http1
          containerPort: 8080
        resources:
          limits:
            cpu: 2000m
            memory: 2Gi
        env:
        # Mount secrets securely from GCP Secret Manager instead of plaintext env vars
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: rag_api_key
              key: "latest"
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: groq_api_key
              key: "latest"
        # Points at ragdb_staging, not the production database -- keeps
        # staging traffic and smoke-test uploads out of production data.
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database_url_staging
              key: "latest"
        # Standard configs
        # Regex-only screening; no tokens, no extra latency.
        - name: ENABLE_INJECTION_SCREENING
          value: "true"
        # Deliberately false: this fails CLOSED, so turning it on before
        # running `gcloud services enable dlp.googleapis.com` replaces every
        # logged question/answer with "[redaction unavailable]".
        - name: ENABLE_PII_REDACTION
          value: "false"
        - name: MODEL_PROVIDER
          value: "groq"
        - name: GCP_PROJECT_ID
          value: "YOUR_PROJECT_ID"
        - name: OTEL_GCP_EXPORT
          value: "true"
        # Deliberately shared with production: Firestore Native mode is
        # one database per GCP project by default, so conversation memory
        # (conversation_sessions) and job tracking (ingest_jobs) aren't
        # isolated between staging and prod here. Fully isolating them
        # would need multi-database Firestore -- deliberately out of scope
        # for this staging environment. Documented, not hidden.
        #
        # A separate queue (not the production ingest-queue) so a staging
        # deploy's async ingestion jobs never target the wrong service --
        # create it once: `gcloud tasks queues create ingest-queue-staging
        # --location=us-central1 --max-attempts=3`.
        - name: CLOUD_TASKS_QUEUE
          value: "ingest-queue-staging"
        # This service's own public URL -- same chicken-and-egg problem as
        # cloudrun-groq.yaml (Cloud Run doesn't know its URL until after
        # first deploy). Filled in post-deploy the same way; see README.
        - name: INGEST_TARGET_URL
          value: "https://REPLACE-WITH-STAGING-SERVICE-URL.run.app"

        # Readiness/Liveness Probes for zero-downtime rollouts
        livenessProbe:
          httpGet:
            path: /health
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /ready
          periodSeconds: 15
