[project]
name = "rag-capstone"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SaiKrishna-Perugu", email = "p.saikrishna355@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4==4.15.0",
    "docx2txt==0.9",
    "fastapi==0.141.1",
    "fastembed>=0.8.0",
    "filetype>=1.2.0",
    "google-cloud-dlp>=3.27.0",
    "google-cloud-firestore>=2.28.0",
    "google-cloud-secret-manager>=2.30.0",
    "google-cloud-tasks>=2.24.0",
    "langchain==1.3.14",
    "langchain-community==0.4.2",
    "langchain-google-vertexai==3.2.4",
    "langchain-groq>=1.1.3",
    "langchain-text-splitters==1.1.2",
    "langgraph==1.2.10",
    "lxml==6.1.1",
    "numpy==2.5.1",
    # OpenTelemetry: exact pins required -- opentelemetry-exporter-prometheus
    # and opentelemetry-exporter-gcp-monitoring each re-pin a narrow
    # opentelemetry-sdk range on every release, so bumping the SDK alone
    # can break resolution. Bump all four together, deliberately.
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-prometheus==0.65b0",
    "opentelemetry-exporter-gcp-monitoring==1.14.0a0",
    "pgvector>=0.3.6",
    "prometheus-client>=0.21.0",
    "psycopg2-binary>=2.9.9",
    "pydantic==2.13.4",
    # pypdf parses /upload's PDFs -- directly reachable by anonymous visitors.
    # 6.14.2 carries PYSEC-2026-3655 / PYSEC-2026-3656, fixed in 6.15.0.
    "pypdf==6.15.0",
    "python-dotenv==1.2.2",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "uvicorn[standard]==0.52.0",
    "flashrank>=0.2.10",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]
# Only eval_ragas.py needs these (RAGAS pulls in HuggingFace `datasets`
# transitively). Kept out of the default/`dev` groups so the Dockerfile's
# plain `uv sync --frozen` -- which installs the runtime image -- doesn't
# ship ~249MB of eval-only deps into every Cloud Run instance. CI's
# eval.yml installs this group explicitly: `uv sync --frozen --group eval`.
eval = [
    "ragas==0.4.3",
    "datasets==5.0.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
# G201: the project's structured-logging convention is logger.error(json_payload,
# exc_info=True) rather than logger.exception(...), so the traceback is attached
# to a JSON-formatted message consistent with every other log line -- see
# app/streaming.py and app/main.py's error handlers.
ignore = ["BLE001", "B008", "SIM117", "G201"]
