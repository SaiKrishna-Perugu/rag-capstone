apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: rag-capstone
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    metadata:
      annotations:
        # Autoscaling bounds (scale to 0 saves money when idle)
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        # Increase concurrency per instance for async FastAPI
        autoscaling.knative.dev/targetBurstCapacity: "100"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: rag-capstone-sa@YOUR_PROJECT_ID.iam.gserviceaccount.com
      containers:
      - image: us-central1-docker.pkg.dev/YOUR_PROJECT_ID/rag-repo/rag-capstone:latest
        ports:
        - name: http1
          containerPort: 8080
        resources:
          limits:
            cpu: 2000m
            memory: 2Gi
        env:
        # Mount secrets securely from GCP Secret Manager instead of plaintext env vars
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: rag_api_key
              key: "latest"
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: groq_api_key
              key: "latest"
        # Standard configs
        - name: MODEL_PROVIDER
          value: "groq"
        - name: CHROMA_DIR
          value: "/app/chroma_db"
        
        # Readiness/Liveness Probes for zero-downtime rollouts
        livenessProbe:
          httpGet:
            path: /health
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /ready
          initialDelaySeconds: 15
          periodSeconds: 15
