apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: rag-capstone
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    metadata:
      annotations:
        # Autoscaling bounds (scale to 0 saves money when idle)
        autoscaling.knative.dev/minScale: "0"
        # Capped at 2 deliberately. slowapi's limiter is IN-PROCESS, so
        # maxScale is the real multiplier on RATE_LIMIT: at 10 instances a
        # configured 20/minute is up to 200/minute in practice. 2 keeps the
        # limiter approximately honest (worst case 2x) and caps worst-case
        # compute on a publicly reachable demo.
        autoscaling.knative.dev/maxScale: '2'
        # Increase concurrency per instance for async FastAPI
        autoscaling.knative.dev/targetBurstCapacity: "100"
        # Cloud SQL Auth Proxy sidecar (auto-manages secure connections)
        run.googleapis.com/cloudsql-instances: YOUR_PROJECT_ID:us-central1:rag-capstone-db
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: rag-capstone-sa@YOUR_PROJECT_ID.iam.gserviceaccount.com
      containers:
      - image: us-central1-docker.pkg.dev/YOUR_PROJECT_ID/rag-repo/rag-capstone:latest
        ports:
        - name: http1
          containerPort: 8080
        resources:
          limits:
            cpu: 2000m
            memory: 2Gi
        env:
        # Mount secrets securely from GCP Secret Manager instead of plaintext env vars
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: rag_api_key
              key: "latest"
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: groq_api_key
              key: "latest"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database_url
              key: "latest"
        # Standard configs
        # Regex-only screening; no tokens, no extra latency.
        - name: ENABLE_INJECTION_SCREENING
          value: "true"
        # Deliberately false: this fails CLOSED, so turning it on before
        # running `gcloud services enable dlp.googleapis.com` replaces every
        # logged question/answer with "[redaction unavailable]".
        - name: ENABLE_PII_REDACTION
          value: "false"
        - name: MODEL_PROVIDER
          value: "groq"
        # Needed even on the Groq path now -- Firestore (conversation
        # memory, app/retrieval/memory.py) and the Cloud Monitoring metrics export
        # both require a project ID regardless of which LLM provider is
        # in use.
        - name: GCP_PROJECT_ID
          value: "YOUR_PROJECT_ID"
        - name: OTEL_GCP_EXPORT
          value: "true"
        # Ceiling on estimated daily LLM+embedding spend (app/llm/budget.py,
        # app/llm/cost.py); 0 disables it, which is how this shipped before.
        # See cloudrun-vertexai.yaml's DAILY_BUDGET_USD comment for how this
        # figure relates to the project's separate Cloud Billing budget.
        - name: DAILY_BUDGET_USD
          value: "0.25"
        # The abuse bounds on /upload, all four of them, matching the
        # vertexai configs. None were declared here at all, so a deploy from
        # this file would have taken config.py's defaults: 50MB x 5 files
        # (a 250MB request) and MAX_CORPUS_CHUNKS=0, meaning no corpus
        # ceiling whatsoever. The upload caps are the pair the 08-22 review
        # named; the corpus caps are the same defect in the same group, and
        # fixing only the named two is how this class has been declared
        # closed twice already without being closed.
        - name: MAX_UPLOAD_FILES
          value: "3"
        - name: MAX_UPLOAD_SIZE_MB
          value: "2"
        - name: RATE_LIMIT
          value: "10/minute"
        - name: MAX_CORPUS_CHUNKS
          value: "3000"
        - name: MAX_SESSION_CHUNKS
          value: "300"
        # Durable staging for uploaded files (app/ingestion/storage.py). Cloud
        # Run instances have independent disks, so a Cloud Task can land on the
        # instance that never received the upload; staging in GCS removes that
        # dependency. Declared here rather than set only with `gcloud run
        # services update` -- imperative-only is how MAX_CORPUS_CHUNKS, the
        # upload limits and ENABLE_PII_REDACTION each drifted from this file.
        # Unset = fall back to instance-local disk (local dev and tests).
        - name: UPLOAD_BUCKET
          value: 'REPLACE-WITH-UPLOAD-BUCKET'
        - name: CLOUD_TASKS_QUEUE
          value: "ingest-queue"
        # This service's own public URL -- Cloud Tasks needs it as the
        # HTTP target for /internal/process-ingest-job, but Cloud Run
        # doesn't know its own URL until after first deploy. Filled in
        # via `gcloud run services update --update-env-vars` post-deploy;
        # see README "Deploying to GCP". A later `services replace` using
        # this file as-is will reset it to the placeholder below, so
        # re-run that update step after any `services replace`.
        - name: INGEST_TARGET_URL
          value: "https://REPLACE-WITH-SERVICE-URL.run.app"

        # Readiness/Liveness Probes for zero-downtime rollouts
        livenessProbe:
          httpGet:
            path: /health
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /ready
          periodSeconds: 15
