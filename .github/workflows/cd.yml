name: CD Pipeline

# Runs on push to main only -- PRs are gated by ci.yml + eval.yml as
# required status checks (once branch protection is enabled, see README
# "Deploying to GCP" one-time setup), so a merge to main already implies
# lint/tests/eval passed.
#
# INERT until the one-time GCP + GitHub setup documented in README
# "Deploying to GCP" is completed by hand -- Workload Identity Federation,
# the `GCP_PROJECT_ID`/`WIF_PROVIDER` repo variables, and the `production`
# environment's required-reviewer rule all have to exist first. Until
# then this workflow will fail at the auth step, which is the correct,
# safe failure mode (no deploy happens) rather than a partial/confusing one.
on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write   # required for Workload Identity Federation
  contents: read

# Without this, a run that is parked at the promote-production approval
# gate stays alive indefinitely while newer commits land -- and approving
# it later deploys ITS commit's image, silently rolling production
# backwards. That happened for real: an older run was approved 43 seconds
# after a newer one finished deploying, reverting production to a build
# that predated a UI fix. Superseding runs on the same branch now cancel
# the stale one, so the gate can only ever ship the newest thing.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/rag-repo/rag-capstone:${{ github.sha }}
  # google-github-actions/auth's `service_account` input is what actually
  # makes it impersonate rag-capstone-sa via the roles/iam.workloadIdentityUser
  # binding set up in README -- omitting it (as every prior version of this
  # workflow did) makes the action use Direct Workload Identity Federation
  # instead: the raw federated principal, not rag-capstone-sa. That's why
  # every IAM grant made to rag-capstone-sa (storage.objectAdmin,
  # serviceusage.serviceUsageConsumer, storage.admin, a fresh source bucket,
  # --billing-project) had zero effect on the real run -- none of them were
  # ever the identity making the calls. Confirmed by the fact that
  # `--impersonate-service-account` testing (which genuinely impersonates)
  # passed while the real WIF-authenticated run kept failing identically.
  SERVICE_ACCOUNT: rag-capstone-sa@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      # Raw gcloud CLI throughout this pipeline, matching this repo's
      # existing convention (README "Deploying to GCP") of never wrapping
      # deploy commands in marketplace Actions. gcloud is preinstalled on
      # ubuntu-latest and auto-configured by the auth step above -- no
      # setup-gcloud action needed.
      #
      # --gcs-source-staging-dir + --billing-project are kept even though
      # they turned out not to be the real fix (see SERVICE_ACCOUNT comment
      # above) -- harmless now that rag-capstone-sa is genuinely
      # impersonated, and the fresh bucket avoids the legacy-ACL default
      # bucket regardless of identity.
      #
      # Confirmed via a real run that the build itself succeeds
      # server-side (`gcloud builds describe` showed SUCCESS) even when
      # the CLI errors out -- it was failing to *stream* the build's logs
      # back. Tried --suppress-logs (doesn't help -- completion-polling
      # uses the same read path as printing), roles/logging.viewer, and
      # even the primitive roles/viewer on rag-capstone-sa -- all failed
      # identically. Same root cause as the source-staging bucket: gcloud
      # streams from its auto-created *default logs bucket*, which
      # (like the old default source-staging bucket) predates Uniform
      # Bucket-Level Access and uses legacy ACLs that don't honor project
      # IAM grants regardless of role. --gcs-log-dir reroutes logs to our
      # own bucket (reusing the same modern one from --gcs-source-staging-dir)
      # the same way --gcs-source-staging-dir already fixed the upload side.
      - name: Build and push image via Cloud Build
        run: gcloud builds submit --tag ${{ env.IMAGE }} --gcs-source-staging-dir=gs://${{ vars.GCP_PROJECT_ID }}-cd-source/source --gcs-log-dir=gs://${{ vars.GCP_PROJECT_ID }}-cd-source/logs --billing-project=${{ vars.GCP_PROJECT_ID }}

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Deploy to staging
        run: |
          gcloud run deploy rag-capstone-staging \
            --image=${{ env.IMAGE }} \
            --region=us-central1

  smoke-test-staging:
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      # /health and /ready are in middleware.py's _PUBLIC_PATHS, but /ask is
      # not -- staging mounts API_KEY from the rag_api_key secret, so an
      # unauthenticated POST /ask returns 401, not an answer. Pull the same
      # key from Secret Manager (rag-capstone-sa already has
      # secretmanager.secretAccessor on it) and mask it so it can't leak
      # into the workflow log.
      - name: Smoke test staging deployment
        run: |
          URL=$(gcloud run services describe rag-capstone-staging --region=us-central1 --format='value(status.url)')
          API_KEY=$(gcloud secrets versions access latest --secret=rag_api_key)
          echo "::add-mask::$API_KEY"
          curl -sf "$URL/health"
          curl -sf "$URL/ready"
          curl -sf -X POST "$URL/ask" -H "Content-Type: application/json" \
            -H "X-API-Key: $API_KEY" \
            -d '{"question": "What is the refund policy?"}' | grep -q '"groundedness"'

  promote-production:
    needs: smoke-test-staging
    runs-on: ubuntu-latest
    # Inert without the one-time manual step: Settings -> Environments ->
    # New environment "production" -> add a required reviewer. Without
    # that, `environment: production` is a no-op and this job runs
    # unattended -- see README "Deploying to GCP".
    environment: production
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      # Canary rollout: deploy with zero traffic, shift 10% to it, wait,
      # then promote to 100%. NOTE: --to-tags=canary=10 assumes the
      # currently-live revision isn't already carrying traffic from a
      # manual `gcloud run deploy` run outside this pipeline (i.e.
      # without --no-traffic) -- once this pipeline exists, stop deploying
      # to prod manually so that assumption keeps holding.
      #
      # The 120s wait is a fixed timer, not a real error-rate check -- a
      # portfolio-scale simplification (same category as the Cloud Tasks
      # queue's --max-attempts=3). A real rollback-on-error-spike gate
      # would wire Cloud Monitoring alerting to this workflow; documented
      # as the next step, not built here.
      - name: Canary deploy to production
        run: |
          gcloud run deploy rag-capstone \
            --image=${{ env.IMAGE }} \
            --region=us-central1 --no-traffic --tag=canary
          gcloud run services update-traffic rag-capstone --region=us-central1 --to-tags=canary=10
          sleep 120
          gcloud run services update-traffic rag-capstone --region=us-central1 --to-latest
          # --to-latest moves TRAFFIC but leaves the tag attached, so the
          # revision now serving 100% of production keeps answering on
          # canary---<service>.run.app too. Production is a public demo with
          # no API key, so that is a second live URL whose name claims to be
          # a pre-release canary -- a trap for anyone (or any smoke test)
          # who trusts the name. The tag is reassigned on the next deploy
          # either way; this just stops it meaning the wrong thing in between.
          gcloud run services update-traffic rag-capstone --region=us-central1 --remove-tags=canary
