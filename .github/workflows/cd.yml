name: CD Pipeline

# Runs on push to main only. This USED to reason that PRs are gated by
# ci.yml + eval.yml as required status checks, so a merge to main already
# implies lint/tests/eval passed -- but that only holds for merges. Direct
# pushes to main, which is how this repo is actually worked, run cd.yml,
# ci.yml and eval.yml as three independent workflows on the same event with
# nothing ordering them. CD could therefore build, deploy to staging and
# reach the production gate while the tests and the paid eval were still
# running, or after they had already failed. The human at the approval gate
# is not shown either result. The require-green-checks job below closes
# that: it waits for both workflows to conclude for THIS commit and fails
# if either did not succeed.
#
# INERT until the one-time GCP + GitHub setup documented in README
# "Deploying to GCP" is completed by hand -- Workload Identity Federation,
# the `GCP_PROJECT_ID`/`WIF_PROVIDER` repo variables, and the `production`
# environment's required-reviewer rule all have to exist first. Until
# then this workflow will fail at the auth step, which is the correct,
# safe failure mode (no deploy happens) rather than a partial/confusing one.
on:
  push:
    branches: [ "main" ]
  # Manual trigger, and the only way past require-green-checks. Without it
  # a red eval.yml -- including one red for infrastructure reasons rather
  # than quality, which has happened here (a too-short RunConfig timeout
  # reports NaN and reads as a quality collapse) -- would block every
  # production deploy with no override, hotfixes included. Fail closed by
  # default, with one deliberate, audited way through.
  workflow_dispatch:
    inputs:
      skip_quality_gate:
        description: "Deploy without waiting for CI/eval to pass (emergency only)"
        type: boolean
        default: false

permissions:
  id-token: write   # required for Workload Identity Federation
  contents: read

# Without this, a run that is parked at the promote-production approval
# gate stays alive indefinitely while newer commits land -- and approving
# it later deploys ITS commit's image, silently rolling production
# backwards. That happened for real: an older run was approved 43 seconds
# after a newer one finished deploying, reverting production to a build
# that predated a UI fix. Superseding runs on the same branch now cancel
# the stale one, so the gate can only ever ship the newest thing.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/rag-repo/rag-capstone:${{ github.sha }}
  # google-github-actions/auth's `service_account` input is what actually
  # makes it impersonate rag-capstone-sa via the roles/iam.workloadIdentityUser
  # binding set up in README -- omitting it (as every prior version of this
  # workflow did) makes the action use Direct Workload Identity Federation
  # instead: the raw federated principal, not rag-capstone-sa. That's why
  # every IAM grant made to rag-capstone-sa (storage.objectAdmin,
  # serviceusage.serviceUsageConsumer, storage.admin, a fresh source bucket,
  # --billing-project) had zero effect on the real run -- none of them were
  # ever the identity making the calls. Confirmed by the fact that
  # `--impersonate-service-account` testing (which genuinely impersonates)
  # passed while the real WIF-authenticated run kept failing identically.
  SERVICE_ACCOUNT: rag-capstone-sa@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com

jobs:
  # Gate: nothing deploys until CI and the eval gate have BOTH concluded
  # successfully for this exact SHA.
  #
  # Polls the Actions API rather than using `workflow_run`, deliberately.
  # workflow_run would invert the trigger -- CD would fire on another
  # workflow's completion, losing this workflow's own concurrency group and
  # the push context the image tag is built from. Polling keeps CD a
  # push-triggered pipeline and adds the ordering that was missing.
  #
  # Fails closed: an eval that errors, times out, or never runs blocks the
  # deploy rather than being read as "not failed". A quality gate that
  # passes when it did not run is the failure mode this exists to prevent
  # (see eval.yml's note on RAGAS reporting NaN for a timed-out job).
  require-green-checks:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Note an intentional bypass
        if: inputs.skip_quality_gate
        run: |
          echo "::warning::Quality gate skipped by explicit workflow_dispatch input. \
          CI and eval results for ${{ github.sha }} were NOT checked."

      - name: Wait for CI and eval to pass for this commit
        if: ${{ !inputs.skip_quality_gate }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Per-workflow budgets, NOT one shared deadline. The first version
          # of this computed a single 20-minute deadline before the loop, so
          # ci.yml and eval.yml drew from the same clock: a 4-minute CI run
          # followed by an 18-minute eval blew the budget and reported a
          # timeout even though both had passed, blocking a deploy for no
          # reason. eval makes real LLM calls against Vertex and is legitimately
          # the slow one, so it gets its own, larger allowance.
          for wf in ci.yml eval.yml; do
            case "$wf" in
              eval.yml) budget=2400 ;;   # 40 min: real LLM calls, per-metric
              *)        budget=900  ;;   # 15 min: lint + mocked tests
            esac
            deadline=$(( $(date +%s) + budget ))
            echo "::group::waiting on $wf for $SHA (up to ${budget}s)"
            while :; do
              status=$(gh api "repos/$REPO/actions/workflows/$wf/runs?head_sha=$SHA&per_page=1" \
                        --jq '.workflow_runs[0].status // "missing"')
              conclusion=$(gh api "repos/$REPO/actions/workflows/$wf/runs?head_sha=$SHA&per_page=1" \
                        --jq '.workflow_runs[0].conclusion // ""')
              echo "$wf: status=$status conclusion=$conclusion"

              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  echo "$wf passed."
                  break
                fi
                echo "::error::$wf concluded '$conclusion' for $SHA -- refusing to deploy. \
                See https://github.com/$REPO/actions/workflows/$wf. To ship anyway, \
                re-run this workflow via Actions > CD Pipeline > Run workflow with \
                'Deploy without waiting for CI/eval to pass' checked."
                exit 1
              fi

              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::Timed out after ${budget}s waiting for $wf on $SHA \
                (last status: $status). Refusing to deploy. If $wf is simply slower \
                than this budget, raise it here rather than skipping the gate."
                exit 1
              fi
              sleep 15
            done
            echo "::endgroup::"
          done

  build-and-push:
    needs: require-green-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      # Raw gcloud CLI throughout this pipeline, matching this repo's
      # existing convention (README "Deploying to GCP") of never wrapping
      # deploy commands in marketplace Actions. gcloud is preinstalled on
      # ubuntu-latest and auto-configured by the auth step above -- no
      # setup-gcloud action needed.
      #
      # --gcs-source-staging-dir + --billing-project are kept even though
      # they turned out not to be the real fix (see SERVICE_ACCOUNT comment
      # above) -- harmless now that rag-capstone-sa is genuinely
      # impersonated, and the fresh bucket avoids the legacy-ACL default
      # bucket regardless of identity.
      #
      # Confirmed via a real run that the build itself succeeds
      # server-side (`gcloud builds describe` showed SUCCESS) even when
      # the CLI errors out -- it was failing to *stream* the build's logs
      # back. Tried --suppress-logs (doesn't help -- completion-polling
      # uses the same read path as printing), roles/logging.viewer, and
      # even the primitive roles/viewer on rag-capstone-sa -- all failed
      # identically. Same root cause as the source-staging bucket: gcloud
      # streams from its auto-created *default logs bucket*, which
      # (like the old default source-staging bucket) predates Uniform
      # Bucket-Level Access and uses legacy ACLs that don't honor project
      # IAM grants regardless of role. --gcs-log-dir reroutes logs to our
      # own bucket (reusing the same modern one from --gcs-source-staging-dir)
      # the same way --gcs-source-staging-dir already fixed the upload side.
      - name: Build and push image via Cloud Build
        run: gcloud builds submit --tag ${{ env.IMAGE }} --gcs-source-staging-dir=gs://${{ vars.GCP_PROJECT_ID }}-cd-source/source --gcs-log-dir=gs://${{ vars.GCP_PROJECT_ID }}-cd-source/logs --billing-project=${{ vars.GCP_PROJECT_ID }}

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Deploy to staging
        run: |
          gcloud run deploy rag-capstone-staging \
            --image=${{ env.IMAGE }} \
            --region=us-central1

  smoke-test-staging:
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      # /health and /ready are in middleware.py's _PUBLIC_PATHS, but /ask is
      # not -- staging mounts API_KEY from the rag_api_key secret, so an
      # unauthenticated POST /ask returns 401, not an answer. Pull the same
      # key from Secret Manager (rag-capstone-sa already has
      # secretmanager.secretAccessor on it) and mask it so it can't leak
      # into the workflow log.
      - name: Smoke test staging deployment
        run: |
          URL=$(gcloud run services describe rag-capstone-staging --region=us-central1 --format='value(status.url)')
          API_KEY=$(gcloud secrets versions access latest --secret=rag_api_key)
          echo "::add-mask::$API_KEY"
          curl -sf "$URL/health"
          curl -sf "$URL/ready"
          curl -sf -X POST "$URL/ask" -H "Content-Type: application/json" \
            -H "X-API-Key: $API_KEY" \
            -d '{"question": "What is the refund policy?"}' | grep -q '"groundedness"'

  promote-production:
    needs: smoke-test-staging
    runs-on: ubuntu-latest
    # Inert without the one-time manual step: Settings -> Environments ->
    # New environment "production" -> add a required reviewer. Without
    # that, `environment: production` is a no-op and this job runs
    # unattended -- see README "Deploying to GCP".
    environment: production
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      # Canary rollout: deploy with zero traffic, shift 10% to it, wait,
      # then promote to 100%. NOTE: --to-tags=canary=10 assumes the
      # currently-live revision isn't already carrying traffic from a
      # manual `gcloud run deploy` run outside this pipeline (i.e.
      # without --no-traffic) -- once this pipeline exists, stop deploying
      # to prod manually so that assumption keeps holding.
      #
      # The 120s wait is a fixed timer, not a real error-rate check -- a
      # deliberate simplification (same category as the Cloud Tasks
      # queue's --max-attempts=3). A real rollback-on-error-spike gate
      # would wire Cloud Monitoring alerting to this workflow; documented
      # as the next step, not built here.
      - name: Canary deploy to production
        run: |
          gcloud run deploy rag-capstone \
            --image=${{ env.IMAGE }} \
            --region=us-central1 --no-traffic --tag=canary
          gcloud run services update-traffic rag-capstone --region=us-central1 --to-tags=canary=10

          # Probe the canary revision directly before giving it everything.
          # This step used to be `sleep 120` and nothing else: a revision
          # that booted and then 500'd on every request was promoted to
          # 100% automatically, because "did not crash on startup" was the
          # only thing being checked. The canary URL addresses THAT revision
          # specifically, so this tests the new code rather than whatever is
          # currently serving.
          CANARY=$(gcloud run services describe rag-capstone --region=us-central1 \
                    --format='value(status.traffic.filter("tag:canary").extract("url"))' | tr -d '[]')
          if [ -z "$CANARY" ]; then
            echo "::error::Could not resolve the canary URL -- refusing to promote."
            exit 1
          fi
          echo "Probing canary: $CANARY"

          # Give it a moment to take traffic, then assert it actually serves.
          sleep 30
          for i in 1 2 3 4 5 6; do
            if curl -sf --max-time 30 "$CANARY/ready" >/dev/null; then
              echo "canary /ready ok (attempt $i)"; break
            fi
            if [ "$i" = "6" ]; then
              echo "::error::Canary never became ready -- refusing to promote."
              exit 1
            fi
            sleep 15
          done

          # /ready only proves dependencies resolve. Ask a real question, so
          # a revision that is up but cannot retrieve or generate is caught
          # here rather than by a visitor.
          if ! curl -sf --max-time 120 -X POST "$CANARY/ask" \
                -H 'Content-Type: application/json' \
                -d '{"question": "What is the refund policy?"}' | grep -q '"groundedness"'; then
            echo "::error::Canary answered /ask without a groundedness verdict -- refusing to promote."
            exit 1
          fi
          echo "Canary passed health and functional probes."

          gcloud run services update-traffic rag-capstone --region=us-central1 --to-latest
          # --to-latest moves TRAFFIC but leaves the tag attached, so the
          # revision now serving 100% of production keeps answering on
          # canary---<service>.run.app too. Production is a public demo with
          # no API key, so that is a second live URL whose name claims to be
          # a pre-release canary -- a trap for anyone (or any smoke test)
          # who trusts the name. The tag is reassigned on the next deploy
          # either way; this just stops it meaning the wrong thing in between.
          gcloud run services update-traffic rag-capstone --region=us-central1 --remove-tags=canary

      # CD deploys by image tag and deliberately preserves the service's live
      # env/secret configuration, which means the four cloudrun-*.yaml files
      # are NOT the deployment source of truth and drift is neither applied
      # nor noticed. That is not theoretical: this session found three live
      # settings that had silently diverged from the checked-in config
      # (startup-cpu-boost declared but never enabled, containerConcurrency
      # 80 against a declared 10, and the upload caps missing from every
      # YAML), each found by hand.
      #
      # Applying the YAML would fix drift and take the demo offline -- it
      # re-mounts API_KEY, resets INGEST_TARGET_URL to a placeholder and
      # drops TASKS_SERVICE_ACCOUNT_EMAIL (see cloudrun-vertexai.yaml). So
      # this reports drift instead of correcting it, and does not fail the
      # deploy: the intent is that someone reads it, not that a legitimate
      # imperative change blocks shipping.
      - name: Report config drift against the checked-in manifest
        continue-on-error: true
        run: |
          echo "Live values for settings the YAML also declares:"
          gcloud run services describe rag-capstone --region=us-central1 \
            --format='value(spec.template.spec.containerConcurrency)' \
            | sed 's/^/  containerConcurrency: /'
          gcloud run services describe rag-capstone --region=us-central1 \
            --format='value(spec.template.metadata.annotations)' \
            | tr ';' '\n' | grep -E 'maxScale|cpu-boost' | sed 's/^/  /'
          for k in MAX_UPLOAD_FILES MAX_UPLOAD_SIZE_MB MAX_SESSION_FILES RATE_LIMIT DAILY_BUDGET_USD ENABLE_UPLOADS; do
            v=$(gcloud run services describe rag-capstone --region=us-central1 \
                  --format="value(spec.template.spec.containers[0].env.filter(\"name:$k\").extract(\"value\"))" | tr -d '[]')
            printf '  %s=%s\n' "$k" "${v:-<unset, falls back to config.py>}"
          done
          echo "Compare against cloudrun-vertexai.yaml before assuming the file describes production."
