name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
        
jobs:
  test:
    runs-on: ubuntu-latest
    # No GROQ_API_KEY here on purpose. This suite is fully mocked -- it
    # patches config.GROQ_API_KEY directly (tests/test_circuit.py) and never
    # reads the env var -- and config.py's _IS_CI check keys off
    # GITHUB_ACTIONS, so the key-required guard already relaxes itself here.
    # Wiring a live secret into a job that cannot use it is how an
    # integration test added later starts making real paid calls without
    # anyone deciding it should. eval.yml is where real API calls belong,
    # deliberately kept separate for exactly that reason.

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run linting
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest tests/ -v
